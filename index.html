<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه وی پی ان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Tahoma, Arial; 
            background-color: var(--tg-theme-bg-color, #fff); 
            color: var(--tg-theme-text-color, #000); 
            padding: 20px; 
            text-align: center; 
        }
        .plan-card { 
            border: 2px solid var(--tg-theme-button-color, #3390ec); 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .plan-card:hover { 
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f4); 
        }
        button { 
            background-color: var(--tg-theme-button-color, #3390ec); 
            color: var(--tg-theme-button-text-color, #fff); 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            width: 100%; 
            font-size: 16px; 
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>انتخاب پلن اشتراک</h2>
    <p>لطفاً یکی از پلن‌های زیر را انتخاب کنید:</p>

    <div class="plan-card">
        <h3>پلن ۱ ماهه (۵۰ گیگ)</h3>
        <p>قیمت: ۱۰۰ هزار تومان</p>
        <button onclick="sendToBot('پلن ۱ ماهه (۵۰ گیگ)')">ادامه و پرداخت</button>
    </div>

    <div class="plan-card">
        <h3>پلن ۳ ماهه (نامحدود)</h3>
        <p>قیمت: ۲۵۰ هزار تومان</p>
        <button onclick="sendToBot('پلن ۳ ماهه - نامحدود')">ادامه و پرداخت</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendToBot(planName) {
            tg.sendData(planName);
        }
    </script>
</body>
</html>
